<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signUp.css">
</head>
<body>
    <div class="container">
        <!-- Left Section (Form) -->
        <div class="left-section">
            <img src="./Images/Footer/tringapps-copy-2.png" alt="Tringapps logo" class="tring-logo">
            <div class="form-box">
                
                <!-- Tabs -->
                <div class="tabs">
                    <button  onclick="location.href='signIn.html'" class="inactive">Sign In</button>
                    <button onclick="location.href='signUp.html'"class="active">Sign Up</button>
                </div>

                <!-- Form -->
                <form id="signupForm">
                    <!-- Name -->
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                    <!-- Email -->
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter email" required>

                    <!-- Language Selection -->
                    <label for="language">Languages</label>
                    <select id="language" name="language" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="english">English</option>
                        <option value="spanish">Spanish</option>
                        <option value="french">French</option>
                        <option value="german">German</option>
                        <option value="tamil">Tamil</option>
                        <option value="hindi">Hindi</option>
                    </select>

                    <!-- Phone Number -->
                    <label for="phone">Phone Number</label>
                    <div class="phone-field">
                        <select id="country-code" name="country-code">
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+81">🇯🇵 +81</option>
                        </select>
                        <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
                    </div>

                    <!-- Password -->
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <span id="togglePassword"><i class="fa fa-eye"></i></span>
                    </div>

                    <!-- Checkboxes -->
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember-me" name="remember-me">
                            <label for="remember-me">Remember me</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="agree" name="agree" required>
                            <label for="agree">I agree to all the <span class="terms">Terms and Privacy Policy</span></label>
                        </div>
                        <div class="radio-container">
                            <input type="radio" id="radio1" name="example">
                            <label for="radio1">I'm over 18+</label>
                        </div>
                    

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn" onclick="location.href='landingPage.html'">Submit</button>

                    <!-- OR Divider -->
                    <div class="or-divider">OR</div>

                    <!-- Google Sign-In -->
                    <button type="button" class="google-signin">
                        Sign Up with <img src="./Images/ic_google.png" alt="Google Icon"> 
                    </button>

                    <!-- Already have an account? -->
                    <p class="signin-text">Have an account? <a href="signUp.html">Sign In</a></p>
                </form>
            </div>
        </div>

        <!-- Right Section (Background Image) -->
        <div class="image-section"></div>
    </div>

    <script src="signIn.js"></script>
</body>
</html>
