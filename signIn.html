<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="signIn.css">
</head>
<body>
    <div class="container">
        <!-- Left Section (Form & Logo) -->
        <div class="left-section">
            <img src="./Images/Footer/tringapps-copy-2.png" alt="Tringapps logo" class="tring-logo">

            <div class="login-box">
                <div class="form-container">
                    <div class="tabs">
                        <button  onclick="location.href='signIn.html'" class="active">Sign In</button>
                        <button onclick="location.href='signUp.html'"class="inactive">Sign Up</button>
                    </div>
                    
                    <form>
                        <label for="email">Your Name <span>*</span></label>
                        <input type="email" id="email" placeholder="Enter email" required>

                        <label for="password">Password <span>*</span></label>
                        <div class="password-field">
                            <input type="password" id="password" placeholder="Enter password" required>
                            <span id="togglePassword"><i class="fa fa-eye"></i></span>
                        </div>

                        <div class="remember-forgot">
                            <input type="checkbox" id="remember-me" name="remember-me"> 
                            <label for="remember-me">Remember me</label>
                            <a href="#">Forgot Password?</a>
                        </div>

                        <button type="submit" class="submit-btn" onclick="location.href='landingPage.html'">Submit</button>

                        <div class="or-divider">OR</div>

                        <button type="button" class="google-signin">
                            Sign In with<img src="./Images/ic_google.png" alt="Google Icon">
                        </button>

                        <p class="signup-text">Don’t have an account? <a href="signUp.html">Sign Up</a></p>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Section (Background Image) -->
        <div class="image-section"></div>
    </div>

    <script src="signIn.js"></script>
</body>
</html>
